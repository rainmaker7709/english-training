<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My English Master</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EngMaster">
    <meta name="theme-color" content="#2563eb">

    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Mobile Scrollbar Hide & Native Feel */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        /* Smooth Card UI Touch Settings */
        #card-touch-area {
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-full transition-colors duration-200">
    <div id="app" class="max-w-md mx-auto bg-white dark:bg-slate-800 min-h-screen shadow-xl flex flex-col relative overflow-hidden">
        
        <!-- Header -->
        <header class="bg-blue-600 dark:bg-slate-900 text-white p-4 sticky top-0 z-20 shadow-md">
            <div class="flex justify-between items-center mb-3">
                <div class="w-8"></div>
                <h1 class="text-xl font-bold tracking-tight">My English Master</h1>
                <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full bg-blue-700 dark:bg-slate-700 flex items-center justify-center text-amber-300 dark:text-amber-400 focus:outline-none" aria-label="Toggle Dark Mode">
                    <i id="dark-icon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
            
            <!-- Main Tabs -->
            <div class="flex justify-around text-xs sm:text-sm font-semibold border-t border-blue-500/30 dark:border-slate-700 pt-2">
                <button onclick="setMainTab('grammar')" id="tab-grammar" class="pb-1 border-b-2 border-white">문법 파트</button>
                <button onclick="setMainTab('conversation')" id="tab-conversation" class="pb-1 border-b-2 border-transparent opacity-70">회화 파트</button>
                <button onclick="setMainTab('bookmarks')" id="tab-bookmarks" class="pb-1 border-b-2 border-transparent opacity-70">⭐ 복습장</button>
            </div>
        </header>

        <!-- Sub Tabs (Horizontally Scrollable) -->
        <nav id="sub-tabs-container" class="bg-gray-50 dark:bg-slate-800/80 border-b border-gray-200 dark:border-slate-700 p-2 z-10">
            <div id="sub-tabs" class="flex overflow-x-auto whitespace-nowrap space-x-2 text-xs font-medium py-1 px-1">
                <!-- Subcategory buttons dynamically loaded -->
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 overflow-y-auto flex flex-col" id="content-area">
            
            <!-- List View Mode -->
            <div id="list-view" class="flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 id="current-category-title" class="text-base font-bold text-gray-800 dark:text-gray-100">카테고리</h2>
                        <p id="item-count-label" class="text-xs text-gray-500 dark:text-gray-400">0개의 예문</p>
                    </div>
                    <button onclick="startFlashcard(0)" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 text-white px-4 py-2 rounded-full font-bold text-sm shadow-md active:scale-95 transition flex items-center space-x-1">
                        <i class="fa-solid fa-play text-xs"></i>
                        <span>카드 학습</span>
                    </button>
                </div>

                <div id="list-container" class="space-y-3 flex-1">
                    <!-- List items dynamically rendered -->
                </div>
            </div>

            <!-- Flashcard View Mode -->
            <div id="flashcard-view" class="hidden flex-1 flex-col justify-between py-2">
                
                <!-- Flashcard Top Control Bar -->
                <div class="flex justify-between items-center mb-2">
                    <button onclick="stopFlashcard()" class="text-gray-500 dark:text-gray-400 font-medium text-sm flex items-center space-x-1">
                        <i class="fa-solid fa-chevron-left"></i>
                        <span>목록으로</span>
                    </button>
                    <div class="flex items-center space-x-3">
                        <button onclick="resetFlashcard()" class="text-xs bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-gray-300 px-2.5 py-1 rounded-md font-medium">
                            <i class="fa-solid fa-rotate-right mr-1"></i>처음부터
                        </button>
                        <span id="card-counter" class="text-sm font-bold text-blue-600 dark:text-blue-400">1 / 10</span>
                    </div>
                </div>

                <!-- Card Container (Touch to Reveal / Swipe Slide) -->
                <div class="flex-1 flex flex-col justify-center my-auto relative overflow-hidden p-1 select-none">
                    <p class="text-center text-xs text-gray-400 dark:text-gray-500 mb-2">
                        <i class="fa-solid fa-hand-pointer mr-1"></i>카드 터치하여 정답 열기/닫기 | <i class="fa-solid fa-arrows-left-right mr-1"></i>좌우 드래그 스와이프
                    </p>
                    
                    <div id="card-touch-area" class="w-full min-h-[340px] bg-white dark:bg-slate-700/90 border-2 border-blue-100 dark:border-slate-600 rounded-2xl p-6 shadow-lg flex flex-col justify-between cursor-grab active:cursor-grabbing">
                        
                        <!-- 1. 터치/스와이프 반응 본문 영역 -->
                        <div id="card-content-body" class="flex-1 flex flex-col justify-between">
                            <!-- Top Tag -->
                            <div class="flex justify-between items-center">
                                <span id="card-front-tag" class="text-xs font-bold text-blue-600 dark:text-blue-300 bg-blue-50 dark:bg-slate-800 px-3 py-1 rounded-full border border-blue-100 dark:border-slate-600">
                                    카테고리
                                </span>
                                <span id="reveal-status-hint" class="text-[11px] text-gray-400 dark:text-gray-400">
                                    💡 터치하여 정답 확인
                                </span>
                            </div>
                            
                            <!-- Korean Sentence -->
                            <div class="my-auto py-6 text-center">
                                <h3 class="text-xl font-bold text-gray-800 dark:text-white leading-relaxed break-keep" id="card-front-ko">
                                    한국어 문장
                                </h3>
                            </div>

                            <!-- Reveal Target: English & Explanation Section -->
                            <div id="reveal-section" class="hidden border-t-2 border-dashed border-blue-100 dark:border-slate-600 pt-4 mt-2 text-center space-y-3">
                                <div>
                                    <span class="text-[10px] font-bold text-blue-500 uppercase tracking-wider block mb-1">English</span>
                                    <h4 class="text-lg font-bold text-blue-600 dark:text-blue-300 leading-snug break-words" id="card-back-en">
                                        English Sentence
                                    </h4>
                                </div>

                                <p class="text-xs text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-slate-800 p-2.5 rounded-lg leading-normal break-keep" id="card-back-note">
                                    설명 및 참고사항
                                </p>
                            </div>
                        </div>

                        <!-- 2. 독립된 하단 액션 바 영역 -->
                        <div id="card-action-bar" class="hidden border-t border-gray-100 dark:border-slate-600/60 pt-3 mt-3">
                            <div class="flex space-x-3 w-full justify-center">
                                <button onclick="speakText()" class="flex-1 max-w-[130px] bg-blue-50 dark:bg-slate-800 hover:bg-blue-100 text-blue-600 dark:text-blue-300 text-xs py-2 px-3 rounded-full font-bold flex items-center justify-center space-x-1.5 transition active:scale-95 border border-blue-200 dark:border-slate-600">
                                    <i class="fa-solid fa-volume-high"></i>
                                    <span>발음 듣기</span>
                                </button>
                                <button onclick="toggleBookmark()" id="btn-bookmark" class="flex-1 max-w-[130px] bg-blue-50 dark:bg-slate-800 hover:bg-blue-100 text-blue-600 dark:text-blue-300 text-xs py-2 px-3 rounded-full font-bold flex items-center justify-center space-x-1.5 transition active:scale-95 border border-blue-200 dark:border-slate-600">
                                    <i class="fa-regular fa-star" id="bookmark-icon"></i>
                                    <span id="bookmark-text">저장하기</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Bottom Navigation Buttons -->
                <div class="flex justify-between items-center space-x-4 pt-2">
                    <button onclick="prevCard()" class="flex-1 py-3 bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-gray-200 rounded-xl font-bold text-sm shadow active:scale-95 transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>이전</span>
                    </button>
                    <button onclick="nextCard()" class="flex-1 py-3 bg-blue-600 dark:bg-blue-500 text-white rounded-xl font-bold text-sm shadow-md active:scale-95 transition flex items-center justify-center space-x-1">
                        <span>다음</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <script>
        const SPREADSHEET_ID = '1_e-3kh0l1W07frstbcBDbd9KXRKJ0biGvr9gd5xFLHI';
        
        const categories = {
            grammar: [
                "문장의형식", "동사의유형", "동사의시제", "조동사", "능동태,수동태", "일치",
                "명사", "관사", "대명사", "형용사,부사", "비교", "전치사",
                "준동사(동명사,부정사)", "분사", "등위접속사,병렬관계", "명사절접속사,부사절접속사", "관계사",
                "가정법", "강조,도치,생략"
            ],
            conversation: [
                "회화(공항에서)", "회화(택시에서)", "회화(식당에서)", "회화(영행지에서)", "회화(대중교통)", "회화(길찾기)"
            ]
        };

        let currentTab = localStorage.getItem('app_last_tab') || 'grammar';
        if (currentTab === 'words') currentTab = 'grammar'; // 단어 탭이 마지막이었던 경우 문법으로 기본 변경

        let currentSubTab = localStorage.getItem('app_last_subtab') || categories.grammar[0];
        let currentView = localStorage.getItem('app_last_view') || 'list';
        
        let currentData = [];
        let cardIndex = 0;
        let isRevealed = false;
        let isAnimating = false;
        let bookmarks = JSON.parse(localStorage.getItem('myBookmarks')) || [];

        window.onload = () => {
            initDarkMode();
            updateTabHeaderUI();
            
            if (currentTab === 'bookmarks') {
                document.getElementById('sub-tabs-container').classList.add('hidden');
                document.getElementById('current-category-title').innerText = '복습장 (저장된 예문)';
                renderList(bookmarks, true);
                if (currentView === 'flashcard' && bookmarks.length > 0) {
                    startFlashcard(getSavedCardIndex());
                }
            } else {
                if (!categories[currentTab]) currentTab = 'grammar';
                renderSubTabs();
                loadSheetData(currentSubTab, true);
            }

            setupSwipeEvents();
        };

        /* --- Dark Mode Logic --- */
        function initDarkMode() {
            const isDark = localStorage.getItem('theme') === 'dark' || 
                (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('dark-icon').className = 'fa-solid fa-sun text-sm';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('dark-icon').className = 'fa-solid fa-moon text-sm';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('dark-icon').className = isDark ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
        }

        /* --- Navigation & Tabs Logic --- */
        function updateTabHeaderUI() {
            document.getElementById('tab-grammar').className = `pb-1 border-b-2 ${currentTab === 'grammar' ? 'border-white opacity-100' : 'border-transparent opacity-70'}`;
            document.getElementById('tab-conversation').className = `pb-1 border-b-2 ${currentTab === 'conversation' ? 'border-white opacity-100' : 'border-transparent opacity-70'}`;
            document.getElementById('tab-bookmarks').className = `pb-1 border-b-2 ${currentTab === 'bookmarks' ? 'border-white opacity-100' : 'border-transparent opacity-70'}`;
        }

        function setMainTab(tab) {
            currentTab = tab;
            localStorage.setItem('app_last_tab', tab);
            updateTabHeaderUI();
            
            stopFlashcard();
            
            const subNav = document.getElementById('sub-tabs-container');
            if (tab === 'bookmarks') {
                subNav.classList.add('hidden');
                document.getElementById('current-category-title').innerText = '복습장 (저장된 예문)';
                renderList(bookmarks, true);
            } else {
                subNav.classList.remove('hidden');
                const savedSub = localStorage.getItem(`app_last_subtab_${tab}`);
                currentSubTab = (savedSub && categories[tab].includes(savedSub)) ? savedSub : categories[tab][0];
                localStorage.setItem('app_last_subtab', currentSubTab);
                renderSubTabs();
                loadSheetData(currentSubTab);
            }
        }

        function renderSubTabs() {
            const subTabsDiv = document.getElementById('sub-tabs');
            subTabsDiv.innerHTML = categories[currentTab].map(cat => 
                `<button onclick="changeSubTab('${cat}')" class="px-3 py-1.5 rounded-full text-xs font-semibold ${cat === currentSubTab ? 'bg-blue-600 text-white shadow' : 'bg-white dark:bg-slate-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-slate-600'} transition active:scale-95">${cat}</button>`
            ).join('');
            
            const activeBtn = subTabsDiv.querySelector('.bg-blue-600');
            if(activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        function changeSubTab(cat) {
            currentSubTab = cat;
            localStorage.setItem('app_last_subtab', cat);
            localStorage.setItem(`app_last_subtab_${currentTab}`, cat);
            renderSubTabs();
            stopFlashcard();
            loadSheetData(currentSubTab);
        }

        /* --- Data Fetching --- */
        async function loadSheetData(sheetName, isInitialLoad = false) {
            const listContainer = document.getElementById('list-container');
            listContainer.innerHTML = '<div class="text-center py-12 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p class="text-xs">데이터를 가져오는 중입니다...</p></div>';
            document.getElementById('current-category-title').innerText = sheetName;
            
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&_t=${Date.now()}`;
            
            try {
                const response = await fetch(url);
                const csvText = await response.text();
                currentData = parseCSV(csvText);
                
                renderList(currentData);

                if (isInitialLoad && currentView === 'flashcard' && currentData.length > 0) {
                    startFlashcard(getSavedCardIndex());
                }
            } catch (error) {
                listContainer.innerHTML = '<div class="text-center py-10 text-red-500 text-xs px-4"><i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i><p>시트 데이터를 가져오지 못했습니다. 구글시트의 공유 설정을 확인해 주세요.</p></div>';
            }
        }

        function parseCSV(str) {
            const arr = [];
            let quote = false, row = [], col = "";
            for (let i = 0; i < str.length; i++) {
                let c = str[i];
                if (c === '"' && str[i+1] === '"') { col += '"'; i++; }
                else if (c === '"') { quote = !quote; }
                else if (c === ',' && !quote) { row.push(col.trim()); col = ""; }
                else if ((c === '\r' || c === '\n') && !quote) { 
                    if(c === '\r' && str[i+1] === '\n') { i++; }
                    row.push(col.trim()); 
                    if(row.length > 1 || row[0] !== '') arr.push(row);
                    row = []; col = ""; 
                }
                else { col += c; }
            }
            if (col !== "") row.push(col.trim());
            if (row.length > 0) arr.push(row);
            
            if(arr.length > 0 && (arr[0][0].includes('한국어') || arr[0][0].includes('A열'))) {
                arr.shift(); 
            }

            return arr.map(row => {
                if(currentTab === 'grammar') {
                    return { ko: row[0] || '', form: row[1] || '', en: row[2] || '', note: row[3] || '', category: currentSubTab };
                } else {
                    return { ko: row[0] || '', form: '', en: row[1] || '', note: row[2] || '', category: currentSubTab };
                }
            }).filter(item => item.ko !== '' || item.en !== '');
        }

        /* --- List View Rendering --- */
        function renderList(data, isBookmark = false) {
            currentData = data;
            const container = document.getElementById('list-container');
            document.getElementById('item-count-label').innerText = `${data.length}개의 예문`;

            if(data.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-16 text-xs"><i class="fa-regular fa-folder-open text-3xl mb-2"></i><p>${isBookmark ? '저장된 복습 카드가 없습니다.' : '등록된 예문이 없습니다.'}</p></div>`;
                return;
            }

            container.innerHTML = data.map((item, index) => {
                const isSaved = bookmarks.some(b => b.en === item.en);
                return `
                <div onclick="startFlashcard(${index})" class="bg-white dark:bg-slate-700/60 border border-gray-100 dark:border-slate-600/60 rounded-xl p-3.5 shadow-sm relative transition hover:shadow-md cursor-pointer active:scale-[0.99]">
                    <div class="flex justify-between items-start gap-2 mb-1.5">
                        <div class="flex-1">
                            <span class="font-bold text-gray-800 dark:text-gray-100 text-sm leading-snug break-keep">${item.ko}</span>
                            ${item.form ? `<span class="ml-1.5 text-[10px] text-blue-600 dark:text-blue-300 bg-blue-50 dark:bg-slate-800 border border-blue-100 dark:border-slate-600 px-1.5 py-0.5 rounded font-medium">${item.form}</span>` : ''}
                        </div>
                        <button onclick="event.stopPropagation(); toggleListBookmark(${index})" class="text-gray-400 dark:text-gray-500 hover:text-amber-400 dark:hover:text-amber-300 p-1">
                            <i class="${isSaved ? 'fa-solid text-amber-400 dark:text-amber-300' : 'fa-regular'} fa-star text-sm"></i>
                        </button>
                    </div>
                    <div class="text-blue-600 dark:text-blue-300 font-semibold text-xs leading-relaxed break-words">${item.en}</div>
                    ${item.note ? `<div class="text-[11px] text-gray-500 dark:text-gray-300 bg-gray-50 dark:bg-slate-800/80 p-2 rounded-lg mt-2 leading-tight">${item.note}</div>` : ''}
                </div>
            `}).join('');
        }

        function toggleListBookmark(index) {
            const item = currentData[index];
            const existsIndex = bookmarks.findIndex(b => b.en === item.en);
            if(existsIndex > -1) {
                bookmarks.splice(existsIndex, 1);
            } else {
                bookmarks.push(item);
            }
            localStorage.setItem('myBookmarks', JSON.stringify(bookmarks));
            renderList(currentData, currentTab === 'bookmarks');
        }

        /* --- Flashcard Progress Persistence --- */
        function saveProgress() {
            const progressKey = `progress_${currentTab}_${currentSubTab}`;
            localStorage.setItem(progressKey, cardIndex);
        }

        function getSavedCardIndex() {
            const progressKey = `progress_${currentTab}_${currentSubTab}`;
            const savedIndex = localStorage.getItem(progressKey);
            return savedIndex !== null ? parseInt(savedIndex, 10) : 0;
        }

        /* --- Flashcard Logic --- */
        function startFlashcard(targetIndex = null) {
            if(currentData.length === 0) return alert('학습할 데이터가 없습니다.');
            
            currentView = 'flashcard';
            localStorage.setItem('app_last_view', 'flashcard');

            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('flashcard-view').classList.remove('hidden');
            document.getElementById('flashcard-view').classList.add('flex');
            
            if(targetIndex !== null) {
                cardIndex = targetIndex;
            } else {
                cardIndex = getSavedCardIndex();
            }
            if(cardIndex >= currentData.length) cardIndex = 0;

            isRevealed = false;
            updateCardUI();
            saveProgress();
        }

        function stopFlashcard() {
            currentView = 'list';
            localStorage.setItem('app_last_view', 'list');

            document.getElementById('list-view').classList.remove('hidden');
            document.getElementById('flashcard-view').classList.add('hidden');
            document.getElementById('flashcard-view').classList.remove('flex');
            renderList(currentData, currentTab === 'bookmarks');
        }

        function resetFlashcard() {
            if(confirm('진도를 처음으로 초기화하시겠습니까?')) {
                cardIndex = 0;
                saveProgress();
                isRevealed = false;
                updateCardUI();
            }
        }

        function toggleReveal() {
            isRevealed = !isRevealed;
            const revealSec = document.getElementById('reveal-section');
            const actionBar = document.getElementById('card-action-bar');
            const hint = document.getElementById('reveal-status-hint');
            
            if(isRevealed) {
                revealSec.classList.remove('hidden');
                actionBar.classList.remove('hidden');
                hint.innerText = '✅ 정답 표시됨';
            } else {
                revealSec.classList.add('hidden');
                actionBar.classList.add('hidden');
                hint.innerText = '💡 터치하여 정답 확인';
            }
        }

        function changeCardIndex(direction) {
            if (direction === 'next') {
                if (cardIndex < currentData.length - 1) {
                    cardIndex++;
                } else {
                    alert('마지막 카드입니다. 첫 카드부터 다시 학습합니다.');
                    cardIndex = 0;
                }
            } else if (direction === 'prev') {
                if (cardIndex > 0) {
                    cardIndex--;
                }
            }
            saveProgress();
            isRevealed = false;
            updateCardUI();
        }

        function nextCard() {
            if (isAnimating) return;
            executeSwipeAnimation('next');
        }

        function prevCard() {
            if (isAnimating) return;
            executeSwipeAnimation('prev');
        }

        function updateCardUI() {
            const item = currentData[cardIndex];
            if (!item) return;

            document.getElementById('card-counter').innerText = `${cardIndex + 1} / ${currentData.length}`;
            
            document.getElementById('card-front-tag').innerText = item.form || item.category || currentSubTab;
            document.getElementById('card-front-ko').innerText = item.ko;
            
            document.getElementById('card-back-en').innerText = item.en;
            document.getElementById('card-back-note').innerText = item.note || '설명 및 참고사항이 없습니다.';

            const revealSec = document.getElementById('reveal-section');
            const actionBar = document.getElementById('card-action-bar');
            const hint = document.getElementById('reveal-status-hint');
            if(isRevealed) {
                revealSec.classList.remove('hidden');
                actionBar.classList.remove('hidden');
                hint.innerText = '✅ 정답 표시됨';
            } else {
                revealSec.classList.add('hidden');
                actionBar.classList.add('hidden');
                hint.innerText = '💡 터치하여 정답 확인';
            }

            const isSaved = bookmarks.some(b => b.en === item.en);
            const bookmarkIcon = document.getElementById('bookmark-icon');
            const bookmarkText = document.getElementById('bookmark-text');
            
            if(isSaved) {
                bookmarkIcon.className = 'fa-solid fa-star text-amber-400';
                bookmarkText.innerText = '저장됨';
            } else {
                bookmarkIcon.className = 'fa-regular fa-star';
                bookmarkText.innerText = '저장하기';
            }
        }

        function toggleBookmark() {
            const item = currentData[cardIndex];
            const existsIndex = bookmarks.findIndex(b => b.en === item.en);
            
            if(existsIndex > -1) {
                bookmarks.splice(existsIndex, 1);
            } else {
                bookmarks.push(item);
            }
            localStorage.setItem('myBookmarks', JSON.stringify(bookmarks));
            updateCardUI();
        }

        function speakText() {
            const text = currentData[cardIndex].en;
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('이 브라우저는 원어민 음성 듣기를 지원하지 않습니다.');
            }
        }

        /* --- Pointer Events --- */
        function setupSwipeEvents() {
            const cardBox = document.getElementById('card-touch-area');
            let startX = 0;
            let startY = 0;
            let deltaX = 0;
            let deltaY = 0;
            let isDragging = false;

            cardBox.addEventListener('pointerdown', (e) => {
                if (isAnimating) return;

                if (e.target.closest('#card-action-bar') || e.target.closest('button')) {
                    isDragging = false;
                    return;
                }

                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                deltaX = 0;
                deltaY = 0;

                cardBox.style.transition = 'none';

                try {
                    cardBox.setPointerCapture(e.pointerId);
                } catch(err) {}
            });

            cardBox.addEventListener('pointermove', (e) => {
                if (!isDragging) return;

                deltaX = e.clientX - startX;
                deltaY = e.clientY - startY;

                const rotate = deltaX * 0.04;
                cardBox.style.transform = `translate3d(${deltaX}px, ${deltaY * 0.12}px, 0) rotate(${rotate}deg)`;
            });

            const handlePointerEnd = (e) => {
                if (!isDragging) return;
                isDragging = false;

                try {
                    cardBox.releasePointerCapture(e.pointerId);
                } catch(err) {}

                const SWIPE_THRESHOLD = 50;

                if (Math.abs(deltaX) < 8 && Math.abs(deltaY) < 8) {
                    cardBox.style.transition = 'transform 0.2s ease-out';
                    cardBox.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
                    toggleReveal();
                    return;
                }

                if (deltaX < -SWIPE_THRESHOLD) {
                    executeSwipeAnimation('next', deltaY);
                } else if (deltaX > SWIPE_THRESHOLD) {
                    executeSwipeAnimation('prev', deltaY);
                } else {
                    cardBox.style.transition = 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1)';
                    cardBox.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
                }
            };

            cardBox.addEventListener('pointerup', handlePointerEnd);
            cardBox.addEventListener('pointercancel', handlePointerEnd);
        }

        function executeSwipeAnimation(direction, deltaY = 0) {
            if (isAnimating) return;
            isAnimating = true;

            const cardBox = document.getElementById('card-touch-area');
            const flyOutX = direction === 'next' ? -window.innerWidth : window.innerWidth;
            const flyInX = direction === 'next' ? 60 : -60;

            cardBox.style.transition = 'transform 0.2s ease-in, opacity 0.2s ease-in';
            cardBox.style.transform = `translate3d(${flyOutX}px, ${deltaY}px, 0) rotate(${direction === 'next' ? -15 : 15}deg)`;
            cardBox.style.opacity = '0';

            setTimeout(() => {
                changeCardIndex(direction);

                cardBox.style.transition = 'none';
                cardBox.style.transform = `translate3d(${flyInX}px, 0, 0) scale(0.95)`;
                cardBox.style.opacity = '0';

                void cardBox.offsetWidth;

                cardBox.style.transition = 'transform 0.2s ease-out, opacity 0.2s ease-out';
                cardBox.style.transform = 'translate3d(0, 0, 0) scale(1)';
                cardBox.style.opacity = '1';

                setTimeout(() => {
                    isAnimating = false;
                }, 200);
            }, 200);
        }
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker 등록 완료'))
                    .catch(err => console.log('Service Worker 등록 실패:', err));
            });
        }
    </script>
